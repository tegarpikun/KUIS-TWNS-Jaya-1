<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Kebakaran TWNS Haya</title>
    <style>
        /* CSS tetap sama seperti sebelumnya */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0d0d40;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #1a1a6b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #ffcc00;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #ffcc00;
            padding-bottom: 10px;
            font-size: 1.5em;
        }

        .question-box {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #2b2b8c;
            border-radius: 10px;
        }

        .question-text {
            font-size: 1.1em;
            margin-bottom: 15px;
            font-weight: bold;
            line-height: 1.5;
        }

        .option-button, .next-button {
            background-color: #4040a1;
            color: #fff;
            border: 2px solid #ffcc00;
            padding: 12px 20px;
            margin: 8px 0;
            width: 100%;
            text-align: left;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 1em;
        }

        .next-button {
            background-color: #ffcc00;
            color: #0d0d40;
            text-align: center;
            font-weight: bold;
            border: none;
        }

        .input-answer {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 2px solid #ffcc00;
            background-color: #0d0d40;
            color: white;
            font-size: 1em;
            box-sizing: border-box;
        }

        .correct { background-color: #4CAF50 !important; }
        .incorrect { background-color: #f44336 !important; }
        .rationale { margin-top: 15px; padding: 10px; border-left: 5px solid #ffcc00; background-color: #3d3d99; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Kuis Pelatihan APAR TWNS Jaya 🥳</h1>
        
        <div id="name-screen">
            <div class="question-box">
                <div class="question-text">Sebelum memulai, masukkan identitas dan departemen Anda, contoh (Alex/RND):</div>
                <input type="text" id="user-name" class="input-answer" placeholder="Nama Lengkap...">
                <button class="next-button" onclick="startQuiz()">Mulai Kuis</button>
            </div>
        </div>

        <div id="quiz-screen" style="display:none;"></div>

        <div id="result-screen" style="display:none; text-align: center;">
            <h2>Hasil Kuis</h2>
            <p id="score-text" style="font-size: 1.2em;"></p>
            <p id="saving-text" style="font-style: italic; color: #ffcc00;">Menyimpan skor...</p>
            <button class="next-button" onclick="location.reload()">Mulai Lagi</button>
        </div>
    </div>

    <script>
        // GANTI URL INI dengan URL Google Apps Script Anda
        const SCRIPT_URL = 'URL_WEB_APP_GOOGLE_SCRIPT_ANDA';

        const quizData = [
            { questionNumber: 1, question: "Apabila terjadi kebakaran di Gudang, apa hal pertama yang harus dilakukan?", options: ["menyelamatkan material", "berlari", "pencet tombol emergency", "mengambil apar"], correctAnswer: "pencet tombol emergency", rationale: ".....", hint: "...." },
            { questionNumber: 2, question: "Lalu setelah tombol dinyalakan maka, apa yang harus dilakukan?", options: ["berlari dan tidak berkerumun", "membantu teman yang memegang apar", "mengambil air", "berteriak api/kebakaran"], correctAnswer: "berteriak api/kebakaran", rationale: "....", hint: "......" },
            { questionNumber: 3, question: "Setelah mendengar bunyi emergency maka hendaknya saudara lari ke...", options: ["flexo", "gudang 8", "depan pantry", "depan gudang"], correctAnswer: "depan pantry", rationale: ".....", hint: "Assembly Point." },
            { questionNumber: 4, question: "Siapa yang boleh mengambil apar dan memadamkan api?", options: ["Yang menyebabkan api", "PIC Gudang/security", "siapa saja", "Mas Rhoma"], correctAnswer: "PIC Gudang/security", rationale: ".....", hint: "......" },
            { questionNumber: 5, question: "Apa yang harus dilakukan jika terjebak asap di dalam gudang?", options: ["Wassalam", "merangkak menghindari asap", "berteriak minta tolong", "diam menunggu"], correctAnswer: "merangkak menghindari asap", rationale: ".....", hint: "...." },
            { questionNumber: 6, question: "Sebutkan salah satu hal di gudang yang dapat menyebabkan kebakaran?", answerType: "text", correctAnswer: "korsleting listrik, merokok, korek, mesin panas", rationale: ".....", hint: "...." }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let userName = "";

        function startQuiz() {
            const nameInput = document.getElementById('user-name').value;
            if (nameInput.trim() === "") {
                alert("Silakan masukkan nama Anda!");
                return;
            }
            userName = nameInput;
            document.getElementById('name-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            const current = quizData[currentQuestionIndex];
            const quizScreen = document.getElementById('quiz-screen');
            let content = '';

            if (current.answerType === "text") {
                content = `
                    <div class="question-box">
                        <div class="question-text">Soal ${current.questionNumber}/${quizData.length}: ${current.question}</div>
                        <input type="text" id="text-input" class="input-answer" placeholder="Ketik jawaban...">
                        <button class="next-button" id="submit-btn" onclick="checkTextAnswer()">Kirim Jawaban</button>
                        <div id="feedback" class="rationale" style="display:none;"></div>
                    </div>
                `;
            } else {
                const optionsHtml = current.options.map(opt => `<button class="option-button" onclick="checkChoiceAnswer(this, '${opt}')">${opt}</button>`).join('');
                content = `
                    <div class="question-box">
                        <div class="question-text">Soal ${current.questionNumber}/${quizData.length}: ${current.question}</div>
                        <div>${optionsHtml}</div>
                        <div id="feedback" class="rationale" style="display:none;"></div>
                    </div>
                `;
            }
            quizScreen.innerHTML = content;
        }

        function checkChoiceAnswer(btn, selected) {
            const current = quizData[currentQuestionIndex];
            const feedback = document.getElementById('feedback');
            document.querySelectorAll('.option-button').forEach(b => b.disabled = true);

            if (selected === current.correctAnswer) {
                btn.classList.add('correct');
                score++;
                feedback.innerHTML = `✅ Benar! <br> ${current.rationale}`;
            } else {
                btn.classList.add('incorrect');
                feedback.innerHTML = `❌ Salah! Jawaban: ${current.correctAnswer}`;
            }
            feedback.style.display = 'block';
            addNextButton();
        }

        function checkTextAnswer() {
            const current = quizData[currentQuestionIndex];
            const input = document.getElementById('text-input');
            const userVal = input.value.toLowerCase().trim();
            const feedback = document.getElementById('feedback');
            
            const validAnswers = current.correctAnswer.split(',').map(a => a.trim().toLowerCase());
            const isCorrect = validAnswers.some(ans => userVal.includes(ans));

            input.disabled = true;
            document.getElementById('submit-btn').style.display = 'none';

            if (isCorrect && userVal !== "") {
                score++;
                input.style.borderColor = "#4CAF50";
                feedback.innerHTML = `✅ Benar! <br> ${current.rationale}`;
            } else {
                input.style.borderColor = "#f44336";
                feedback.innerHTML = `❌ Kurang tepat. Jawaban: ${current.correctAnswer}`;
            }
            feedback.style.display = 'block';
            addNextButton();
        }

        function addNextButton() {
            const btn = document.createElement('button');
            btn.className = 'next-button';
            btn.textContent = (currentQuestionIndex < quizData.length - 1) ? 'Lanjut' : 'Lihat Hasil';
            btn.onclick = () => {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) loadQuestion();
                else showResult();
            };
            document.getElementById('quiz-screen').appendChild(btn);
        }

        function showResult() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('score-text').innerHTML = `Halo <b>${userName}</b>, skor Anda: <b>${score} / ${quizData.length}</b>`;
            
            // Kirim ke Google Sheets
            sendDataToSheet();
        }

        function sendDataToSheet() {
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Penting untuk Apps Script
                body: JSON.stringify({
                    nama: userName,
                    skor: score + "/" + quizData.length,
                    waktu: new Date().toLocaleString('id-ID')
                }),
                headers: { 'Content-Type': 'application/json' }
            }).then(() => {
                document.getElementById('saving-text').innerHTML = "✅ Skor berhasil disimpan!";
            }).catch(() => {
                document.getElementById('saving-text').innerHTML = "❌ Gagal menyimpan skor.";
            });
        }
    </script>
</body>
</html>
